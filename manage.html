<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LUNÉRA — Management</title>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f7f4ef;color:#151212;font-family:Arial}
header{background:#151212;color:white;padding:28px 7%;display:flex;justify-content:space-between;align-items:center}
.logo{color:white;text-decoration:none;font:500 27px 'Bodoni Moda';letter-spacing:8px}
.back{color:white;text-decoration:none;font:9px 'Montserrat';letter-spacing:2px;border:1px solid #ffffff88;padding:11px 16px}
.page{width:84%;max-width:1400px;margin:70px auto 100px}
.eyebrow{font:10px 'Montserrat';letter-spacing:5px;text-transform:uppercase;opacity:.5;margin-bottom:18px}
h1{font:400 clamp(50px,6vw,82px) 'Bodoni Moda'}
.intro{margin-top:20px;max-width:650px;font:11px/1.8 'Montserrat';opacity:.6}
.section{margin-top:70px;border-top:1px solid #d8d1c7;padding-top:35px}
.section-title{font:400 38px 'Bodoni Moda';margin-bottom:30px}
.hero-settings,.product-card{background:white;border:1px solid #e1dbd2;padding:30px}
.hero-preview{width:100%;height:400px;object-fit:cover;margin-bottom:25px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:25px}
.product-card{padding:25px}
.product-number{font:9px 'Montserrat';letter-spacing:3px;opacity:.45;margin-bottom:15px;text-transform:uppercase}
.product-preview{width:100%;height:300px;object-fit:cover;margin-bottom:25px}
label{display:block;font:9px 'Montserrat';letter-spacing:2px;text-transform:uppercase;margin:18px 0 8px;opacity:.65}
input,textarea{width:100%;padding:13px 14px;border:1px solid #d8d1c7;background:#faf8f4;font:13px Arial}
textarea{min-height:100px;resize:vertical}
.actions{margin-top:50px;display:flex;gap:12px}
button{border:0;padding:15px 25px;cursor:pointer;font:9px 'Montserrat';letter-spacing:2px;text-transform:uppercase}
.save{background:#17352b;color:white}.reset{background:#151212;color:white}
.status{margin-top:18px;font:10px 'Montserrat';letter-spacing:2px;opacity:0}.status.show{opacity:1}
#login{position:fixed;inset:0;background:#151212;z-index:100;display:grid;place-items:center}
.login-box{background:#f7f4ef;width:360px;padding:40px;text-align:center}
.login-box h2{font:400 40px 'Bodoni Moda';margin-bottom:25px}
.login-box input{margin-bottom:15px}
.login-box button{width:100%;background:#17352b;color:white}
#error{font:10px 'Montserrat';color:#8b3030;margin-top:12px;display:none}
@media(max-width:850px){header{padding:22px 6%}.page{width:88%;margin-top:50px}.hero-preview{height:250px}.products{grid-template-columns:1fr}}
</style>
</head>

<body>

<div id="login">
<div class="login-box">
<h2>LUNÉRA</h2>
<input id="password" type="password" placeholder="Management Password">
<button onclick="login()">ENTER MANAGEMENT</button>
<div id="error">Incorrect password</div>
</div>
</div>

<header>
<a href="index.html" class="logo">LUNÉRA</a>
<a href="index.html" class="back">BACK TO WEBSITE</a>
</header>

<main class="page">

<div class="eyebrow">The House of LUNÉRA</div>
<h1>Management</h1>
<p class="intro">Update the visual identity and product catalogue of LUNÉRA without editing the website code.</p>

<section class="section">
<div class="section-title">Home Page</div>

<div class="hero-settings">
<div class="product-number">Main Hero Image</div>

<img id="heroPreview" class="hero-preview">

<label>Hero Image URL</label>
<input id="heroImage" oninput="updateHero()">
</div>
</section>

<section class="section">
<div class="section-title">Product Catalogue</div>

<div class="products" id="products"></div>

<div class="actions">
<button class="save" onclick="saveAll()">SAVE CHANGES</button>
<button class="reset" onclick="resetAll()">RESET EVERYTHING</button>
</div>

<div class="status" id="status">CHANGES SAVED</div>
</section>

</main>

<script>
const defaultHero="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=2400&q=95";

const defaults=[
{id:"signature-bra",name:"The Signature Bra",category:"Bras · Lace · Signature",price:"₹1,499",sizes:"32, 34, 36, 38, 40",image:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=1800&q=95",description:"A refined lace essential designed around everyday comfort, confident support and timeless LUNÉRA elegance."},
{id:"everyday-brief",name:"The Everyday Brief",category:"Panties · Everyday",price:"₹699",sizes:"S, M, L, XL",image:"https://images.unsplash.com/photo-1596755389378-c31d21fd1273?auto=format&fit=crop&w=1800&q=95",description:"A refined everyday essential designed for comfortable wear and an effortless finish."},
{id:"signature-set",name:"The Signature Set",category:"Lingerie Sets · Signature",price:"₹2,499",sizes:"32, 34, 36, 38, 40",image:"https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?auto=format&fit=crop&w=1800&q=95",description:"A coordinated LUNÉRA set bringing together refined design, comfort and timeless elegance."},
{id:"soft-form",name:"The Soft Form",category:"Bras · Wireless",price:"₹1,299",sizes:"32, 34, 36, 38, 40",image:"https://images.unsplash.com/photo-1583743814966-8936f37f384c?auto=format&fit=crop&w=1800&q=95",description:"A softly structured everyday bra created for easy movement and comfortable support."},
{id:"seamless-essential",name:"The Seamless Essential",category:"Essentials · Seamless",price:"₹899",sizes:"S, M, L, XL",image:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=1800&q=95",description:"A clean seamless essential designed to sit smoothly beneath everyday outfits."},
{id:"evening-set",name:"The Evening Set",category:"Nightwear · Lounge",price:"₹1,899",sizes:"S, M, L, XL",image:"https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?auto=format&fit=crop&w=1800&q=95",description:"An elegant lounge set designed for relaxed evenings and effortless comfort."},
{id:"lace-frame",name:"The Lace Frame",category:"Bras · Lace",price:"₹1,599",sizes:"32, 34, 36, 38, 40",image:"https://images.unsplash.com/photo-1506629905607-d9a0c1eecb3a?auto=format&fit=crop&w=1800&q=95",description:"A refined lace design combining delicate detailing with comfortable everyday wear."},
{id:"pure-essential",name:"The Pure Essential",category:"Essentials · Cotton",price:"₹799",sizes:"S, M, L, XL",image:"https://images.unsplash.com/photo-1581044777550-4cfa60707c03?auto=format&fit=crop&w=1800&q=95",description:"A clean cotton essential created for dependable everyday comfort."},
{id:"bridal-collection",name:"The Bridal Collection",category:"Lingerie Sets · Bridal",price:"₹2,799",sizes:"32, 34, 36, 38, 40",image:"https://images.unsplash.com/photo-1571513722275-4b41940f54b8?auto=format&fit=crop&w=1800&q=95",description:"A carefully designed coordinated collection for special occasions, combining refined details with comfort."}
];

let products=JSON.parse(localStorage.getItem("luneraProducts"))||JSON.parse(JSON.stringify(defaults));

function login(){
if(document.getElementById("password").value==="lunera2026"){
sessionStorage.setItem("luneraAdmin","yes");
document.getElementById("login").style.display="none";
}else{
document.getElementById("error").style.display="block";
}
}

if(sessionStorage.getItem("luneraAdmin")==="yes"){
document.getElementById("login").style.display="none";
}

const hero=localStorage.getItem("luneraHero")||defaultHero;
document.getElementById("heroImage").value=hero;
document.getElementById("heroPreview").src=hero;

function updateHero(){
document.getElementById("heroPreview").src=document.getElementById("heroImage").value;
}

function render(){
document.getElementById("products").innerHTML=products.map((p,i)=>`
<div class="product-card">

<div class="product-number">Product ${String(i+1).padStart(2,"0")}</div>

<img id="preview-${i}" class="product-preview" src="${p.image}">

<label>Product Name</label>
<input id="name-${i}" value="${p.name}">

<label>Price</label>
<input id="price-${i}" value="${p.price}">

<label>Category</label>
<input id="category-${i}" value="${p.category}">

<label>Available Sizes</label>
<input id="sizes-${i}" value="${p.sizes}">

<label>Image URL</label>
<input id="image-${i}" value="${p.image}" oninput="preview(${i})">

<label>Description</label>
<textarea id="description-${i}">${p.description}</textarea>

</div>`).join("");
}

function preview(i){
document.getElementById("preview-"+i).src=document.getElementById("image-"+i).value;
}

function saveAll(){

products=products.map((p,i)=>({
id:p.id,
name:document.getElementById("name-"+i).value,
price:document.getElementById("price-"+i).value,
category:document.getElementById("category-"+i).value,
sizes:document.getElementById("sizes-"+i).value,
image:document.getElementById("image-"+i).value,
description:document.getElementById("description-"+i).value
}));

localStorage.setItem("luneraProducts",JSON.stringify(products));
localStorage.setItem("luneraHero",document.getElementById("heroImage").value.trim());

document.getElementById("status").classList.add("show");
setTimeout(()=>document.getElementById("status").classList.remove("show"),2500);
}

function resetAll(){
if(!confirm("Reset all LUNÉRA changes?"))return;

localStorage.removeItem("luneraProducts");
localStorage.removeItem("luneraHero");

products=JSON.parse(JSON.stringify(defaults));

document.getElementById("heroImage").value=defaultHero;
document.getElementById("heroPreview").src=defaultHero;

render();
}

render();
</script>

</body>
</html>
