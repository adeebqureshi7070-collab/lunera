<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LUNÉRA — Management</title>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f7f4ef;color:#151212;font-family:Arial}
header{background:#151212;color:white;padding:28px 7%;display:flex;justify-content:space-between;align-items:center}
.logo{color:white;text-decoration:none;font:500 27px 'Bodoni Moda';letter-spacing:8px}
.back{color:white;text-decoration:none;font:9px 'Montserrat';letter-spacing:2px;border:1px solid #ffffff88;padding:11px 16px}
.page{width:84%;max-width:1400px;margin:70px auto 100px}
.eyebrow{font:10px 'Montserrat';letter-spacing:5px;text-transform:uppercase;opacity:.5;margin-bottom:18px}
h1{font:400 clamp(50px,6vw,82px) 'Bodoni Moda'}
.intro{margin-top:20px;max-width:650px;font:11px/1.8 'Montserrat';opacity:.6}
.section{margin-top:70px;border-top:1px solid #d8d1c7;padding-top:35px}
.section-title{font:400 38px 'Bodoni Moda';margin-bottom:30px}

.hero-settings,.product-card,.category-card{
background:white;
border:1px solid #e1dbd2;
padding:30px
}

.hero-preview{
width:100%;
height:400px;
object-fit:cover;
margin-bottom:25px
}

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:25px
}

.product-card{padding:25px}

.product-number{
font:9px 'Montserrat';
letter-spacing:3px;
opacity:.45;
margin-bottom:15px;
text-transform:uppercase
}

.product-preview{
width:100%;
height:300px;
object-fit:cover;
margin-bottom:25px
}

label{
display:block;
font:9px 'Montserrat';
letter-spacing:2px;
text-transform:uppercase;
margin:18px 0 8px;
opacity:.65
}

input,textarea,select{
width:100%;
padding:13px 14px;
border:1px solid #d8d1c7;
background:#faf8f4;
font:13px Arial
}

textarea{
min-height:100px;
resize:vertical
}

.actions{
margin-top:25px;
display:flex;
gap:12px;
flex-wrap:wrap
}

button{
border:0;
padding:15px 25px;
cursor:pointer;
font:9px 'Montserrat';
letter-spacing:2px;
text-transform:uppercase
}

.save{background:#17352b;color:white}
.reset{background:#151212;color:white}
.secondary{background:#e8e2da;color:#151212}
.danger{background:#8b3030;color:white}

.status{
margin-top:18px;
font:10px 'Montserrat';
letter-spacing:2px;
opacity:0
}

.status.show{opacity:1}

.category-manager{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px
}

.category-card{
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px
}

.category-name{
font:400 22px 'Cormorant Garamond'
}

.category-delete{
padding:9px 12px;
background:#151212;
color:white
}

.add-box{
background:#fff;
border:1px solid #e1dbd2;
padding:30px;
margin-bottom:25px
}

.empty{
padding:40px;
background:#fff;
border:1px solid #e1dbd2;
font:11px 'Montserrat';
opacity:.6;
text-align:center
}

#login{
position:fixed;
inset:0;
background:#151212;
z-index:100;
display:grid;
place-items:center
}

.login-box{
background:#f7f4ef;
width:360px;
padding:40px;
text-align:center
}

.login-box h2{
font:400 40px 'Bodoni Moda';
margin-bottom:25px
}

.login-box input{margin-bottom:15px}
.login-box button{
width:100%;
background:#17352b;
color:white
}

#error{
font:10px 'Montserrat';
color:#8b3030;
margin-top:12px;
display:none
}

@media(max-width:850px){
header{padding:22px 6%}
.page{width:88%;margin-top:50px}
.hero-preview{height:250px}
.products{grid-template-columns:1fr}
.category-manager{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="login">
<div class="login-box">
<h2>LUNÉRA</h2>
<input id="password" type="password" placeholder="Management Password">
<button onclick="login()">ENTER MANAGEMENT</button>
<div id="error">Incorrect password</div>
</div>
</div>

<header>
<a href="index.html" class="logo">LUNÉRA</a>
<a href="index.html" class="back">BACK TO WEBSITE</a>
</header>

<main class="page">

<div class="eyebrow">The House of LUNÉRA</div>
<h1>Management</h1>

<p class="intro">
Manage the visual identity, categories and product catalogue of LUNÉRA without editing the website code.
</p>


<!-- HOME -->

<section class="section">

<div class="section-title">Home Page</div>

<div class="hero-settings">

<div class="product-number">Main Hero Image</div>

<img id="heroPreview" class="hero-preview">

<label>Hero Image URL</label>

<input id="heroImage" oninput="updateHero()">

<div class="actions">
<button class="save" onclick="saveHero()">SAVE HERO</button>
</div>

</div>

</section>


<!-- CATEGORIES -->

<section class="section">

<div class="section-title">Categories</div>

<div class="add-box">

<label>New Category Name</label>

<input id="newCategory" placeholder="Example: Shapewear">

<div class="actions">
<button class="save" onclick="addCategory()">ADD CATEGORY</button>
</div>

</div>

<div class="category-manager" id="categories"></div>

</section>


<!-- ADD PRODUCT -->

<section class="section">

<div class="section-title">Add Catalogue</div>

<div class="add-box">

<label>Product Name</label>
<input id="newName" placeholder="Example: The Silk Essential">

<label>Price</label>
<input id="newPrice" placeholder="₹1,499">

<label>Category</label>
<select id="newCategorySelect"></select>

<label>Available Sizes</label>
<input id="newSizes" placeholder="S, M, L, XL">

<label>Image URL</label>
<input id="newImage" placeholder="https://...">

<label>Description</label>
<textarea id="newDescription" placeholder="Product description"></textarea>

<div class="actions">
<button class="save" onclick="addProduct()">ADD PRODUCT TO CATALOGUE</button>
</div>

</div>

</section>


<!-- PRODUCTS -->

<section class="section">

<div class="section-title">Product Catalogue</div>

<div class="products" id="products"></div>

<div class="actions">
<button class="save" onclick="saveAll()">SAVE ALL CHANGES</button>
<button class="reset" onclick="resetAll()">RESET EVERYTHING</button>
</div>

<div class="status" id="status">CHANGES SAVED</div>

</section>

</main>


<script>

const defaultHero =
"https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=2400&q=95";


const defaults=[

{
id:"signature-bra",
name:"The Signature Bra",
category:"Bras",
price:"₹1,499",
sizes:"32, 34, 36, 38, 40",
image:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=1800&q=95",
description:"A refined lace essential designed around everyday comfort, confident support and timeless LUNÉRA elegance."
},

{
id:"everyday-brief",
name:"The Everyday Brief",
category:"Panties",
price:"₹699",
sizes:"S, M, L, XL",
image:"https://images.unsplash.com/photo-1596755389378-c31d21fd1273?auto=format&fit=crop&w=1800&q=95",
description:"A refined everyday essential designed for comfortable wear and an effortless finish."
},

{
id:"signature-set",
name:"The Signature Set",
category:"Lingerie Sets",
price:"₹2,499",
sizes:"32, 34, 36, 38, 40",
image:"https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?auto=format&fit=crop&w=1800&q=95",
description:"A coordinated LUNÉRA set bringing together refined design, comfort and timeless elegance."
},

{
id:"soft-form",
name:"The Soft Form",
category:"Bras",
price:"₹1,299",
sizes:"32, 34, 36, 38, 40",
image:"https://images.unsplash.com/photo-1583743814966-8936f37f384c?auto=format&fit=crop&w=1800&q=95",
description:"A softly structured everyday bra created for easy movement and comfortable support."
},

{
id:"seamless-essential",
name:"The Seamless Essential",
category:"Essentials",
price:"₹899",
sizes:"S, M, L, XL",
image:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=1800&q=95",
description:"A clean seamless essential designed to sit smoothly beneath everyday outfits."
},

{
id:"evening-set",
name:"The Evening Set",
category:"Nightwear",
price:"₹1,899",
sizes:"S, M, L, XL",
image:"https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?auto=format&fit=crop&w=1800&q=95",
description:"An elegant lounge set designed for relaxed evenings and effortless comfort."
},

{
id:"lace-frame",
name:"The Lace Frame",
category:"Bras",
price:"₹1,599",
sizes:"32, 34, 36, 38, 40",
image:"https://images.unsplash.com/photo-1506629905607-d9a0c1eecb3a?auto=format&fit=crop&w=1800&q=95",
description:"A refined lace design combining delicate detailing with comfortable everyday wear."
},

{
id:"pure-essential",
name:"The Pure Essential",
category:"Essentials",
price:"₹799",
sizes:"S, M, L, XL",
image:"https://images.unsplash.com/photo-1581044777550-4cfa60707c03?auto=format&fit=crop&w=1800&q=95",
description:"A clean cotton essential created for dependable everyday comfort."
},

{
id:"bridal-collection",
name:"The Bridal Collection",
category:"Lingerie Sets",
price:"₹2,799",
sizes:"32, 34, 36, 38, 40",
image:"https://images.unsplash.com/photo-1571513722275-4b41940f54b8?auto=format&fit=crop&w=1800&q=95",
description:"A carefully designed coordinated collection for special occasions, combining refined details with comfort."
}

];


let products =
JSON.parse(localStorage.getItem("luneraProducts")) ||
JSON.parse(JSON.stringify(defaults));


let categories =
JSON.parse(localStorage.getItem("luneraCategories")) ||
["Bras","Panties","Lingerie Sets","Nightwear","Essentials"];


function login(){

if(document.getElementById("password").value==="lunera2026"){

sessionStorage.setItem("luneraAdmin","yes");

document.getElementById("login").style.display="none";

}else{

document.getElementById("error").style.display="block";

}

}


if(sessionStorage.getItem("luneraAdmin")==="yes"){
document.getElementById("login").style.display="none";
}


const hero =
localStorage.getItem("luneraHero") ||
defaultHero;


document.getElementById("heroImage").value=hero;
document.getElementById("heroPreview").src=hero;


function updateHero(){

document.getElementById("heroPreview").src=
document.getElementById("heroImage").value;

}


function saveHero(){

localStorage.setItem(
"luneraHero",
document.getElementById("heroImage").value.trim()
);

showStatus();

}


function saveData(){

localStorage.setItem(
"luneraProducts",
JSON.stringify(products)
);

localStorage.setItem(
"luneraCategories",
JSON.stringify(categories)
);

}


function addCategory(){

const input=document.getElementById("newCategory");

const name=input.value.trim();

if(!name){
alert("Please enter a category name.");
return;
}

if(categories.some(c=>c.toLowerCase()===name.toLowerCase())){
alert("This category already exists.");
return;
}

categories.push(name);

saveData();

input.value="";

renderCategories();
renderCategorySelect();

showStatus();

}


function deleteCategory(index){

const category=categories[index];

const used=products.some(
p=>p.category.toLowerCase()===category.toLowerCase()
);

if(used){

alert(
"This category contains products. Move or delete those products first."
);

return;

}

if(!confirm("Delete category '"+category+"'?")) return;

categories.splice(index,1);

saveData();

renderCategories();
renderCategorySelect();

showStatus();

}


function renderCategories(){

document.getElementById("categories").innerHTML=

categories.map((c,i)=>`

<div class="category-card">

<div class="category-name">${escapeHTML(c)}</div>

<button
class="category-delete"
onclick="deleteCategory(${i})">
DELETE
</button>

</div>

`).join("");

}


function renderCategorySelect(){

document.getElementById("newCategorySelect").innerHTML=

categories.map(c=>
`<option value="${escapeAttr(c)}">${escapeHTML(c)}</option>`
).join("");

}


function addProduct(){

const name=document.getElementById("newName").value.trim();

const price=document.getElementById("newPrice").value.trim();

const category=document.getElementById("newCategorySelect").value;

const sizes=document.getElementById("newSizes").value.trim();

const image=document.getElementById("newImage").value.trim();

const description=document.getElementById("newDescription").value.trim();


if(!name || !price || !category || !image){

alert("Please fill Product Name, Price, Category and Image URL.");

return;

}


const id =
name.toLowerCase()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"")
+
"-"+
Date.now();


products.push({

id:id,

name:name,

price:price,

category:category,

sizes:sizes || "S, M, L, XL",

image:image,

description:
description ||
"Refined LUNÉRA design created around comfort and timeless elegance."

});


saveData();

document.getElementById("newName").value="";
document.getElementById("newPrice").value="";
document.getElementById("newSizes").value="";
document.getElementById("newImage").value="";
document.getElementById("newDescription").value="";

render();

showStatus();

}


function render(){

if(products.length===0){

document.getElementById("products").innerHTML=
`<div class="empty">No products in the catalogue.</div>`;

return;

}


document.getElementById("products").innerHTML=

products.map((p,i)=>`

<div class="product-card">

<div class="product-number">
Product ${String(i+1).padStart(2,"0")}
</div>

<img
id="preview-${i}"
class="product-preview"
src="${escapeAttr(p.image)}"
onerror="this.style.opacity='.3'"
>

<label>Product Name</label>

<input
id="name-${i}"
value="${escapeAttr(p.name)}"
>

<label>Price</label>

<input
id="price-${i}"
value="${escapeAttr(p.price)}"
>

<label>Category</label>

<select id="category-${i}">

${categories.map(c=>`

<option
value="${escapeAttr(c)}"
${c===p.category?"selected":""}
>
${escapeHTML(c)}
</option>

`).join("")}

</select>


<label>Available Sizes</label>

<input
id="sizes-${i}"
value="${escapeAttr(p.sizes)}"
>


<label>Image URL</label>

<input
id="image-${i}"
value="${escapeAttr(p.image)}"
oninput="preview(${i})"
>


<label>Description</label>

<textarea id="description-${i}">${escapeHTML(p.description)}</textarea>


<div class="actions">

<button
class="save"
onclick="saveProduct(${i})">
SAVE PRODUCT
</button>

<button
class="danger"
onclick="deleteProduct(${i})">
DELETE PRODUCT
</button>

</div>

</div>

`).join("");

}


function saveProduct(i){

products[i]={

id:products[i].id,

name:document.getElementById("name-"+i).value.trim(),

price:document.getElementById("price-"+i).value.trim(),

category:document.getElementById("category-"+i).value,

sizes:document.getElementById("sizes-"+i).value.trim(),

image:document.getElementById("image-"+i).value.trim(),

description:document.getElementById("description-"+i).value.trim()

};

saveData();

render();

showStatus();

}


function deleteProduct(i){

if(!confirm("Delete this product from the catalogue?")) return;

products.splice(i,1);

saveData();

render();

showStatus();

}


function preview(i){

document.getElementById("preview-"+i).src=
document.getElementById("image-"+i).value;

}


function saveAll(){

products=products.map((p,i)=>({

id:p.id,

name:document.getElementById("name-"+i).value.trim(),

price:document.getElementById("price-"+i).value.trim(),

category:document.getElementById("category-"+i).value,

sizes:document.getElementById("sizes-"+i).value.trim(),

image:document.getElementById("image-"+i).value.trim(),

description:document.getElementById("description-"+i).value.trim()

}));


saveData();

showStatus();

}


function resetAll(){

if(!confirm("Reset all LUNÉRA catalogue changes?")) return;

localStorage.removeItem("luneraProducts");
localStorage.removeItem("luneraCategories");
localStorage.removeItem("luneraHero");

products=JSON.parse(JSON.stringify(defaults));

categories=[
"Bras",
"Panties",
"Lingerie Sets",
"Nightwear",
"Essentials"
];

document.getElementById("heroImage").value=defaultHero;
document.getElementById("heroPreview").src=defaultHero;

renderCategories();
renderCategorySelect();
render();

showStatus();

}


function showStatus(){

const status=document.getElementById("status");

status.classList.add("show");

setTimeout(()=>{
status.classList.remove("show");
},2500);

}


function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttr(value){

return escapeHTML(value);

}


renderCategories();
renderCategorySelect();
render();

</script>

</body>
</html>
