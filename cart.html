<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>LUNÉRA — Bag</title>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box
}

body{
background:#f7f4ef;
color:#151212;
font-family:Arial
}

header{
padding:27px 8%;
background:#151212;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
display:flex;
align-items:center;
text-decoration:none
}

.logo img{
width:105px;
height:auto;
display:block
}

.back{
color:white;
text-decoration:none;
font:9px 'Montserrat';
letter-spacing:2px
}

.container{
width:84%;
max-width:1200px;
margin:70px auto
}

.title-row{
display:flex;
justify-content:space-between;
align-items:flex-end;
gap:20px;
margin-bottom:45px
}

h1{
font:400 60px 'Bodoni Moda'
}

.clear{
border:0;
background:none;
font:9px 'Montserrat';
letter-spacing:2px;
cursor:pointer;
text-decoration:underline
}

.item{
display:grid;
grid-template-columns:150px 1fr auto;
gap:30px;
padding:25px 0;
border-bottom:1px solid #15121222;
align-items:center
}

.item img{
width:150px;
height:190px;
object-fit:cover
}

.name{
font:400 26px 'Bodoni Moda';
margin-bottom:10px
}

.info{
font:10px 'Montserrat';
letter-spacing:1px;
opacity:.6;
margin-bottom:18px
}

.quantity{
display:flex;
align-items:center;
gap:15px
}

.quantity button{
width:28px;
height:28px;
border:1px solid #15121255;
background:none;
cursor:pointer
}

.remove{
display:block;
margin-top:15px;
border:0;
background:none;
font:9px 'Montserrat';
letter-spacing:2px;
cursor:pointer
}

.item-price{
font:13px 'Montserrat';
white-space:nowrap
}

.summary{
width:370px;
margin:50px 0 0 auto;
border-top:1px solid #151212;
padding-top:20px
}

.row{
display:flex;
justify-content:space-between;
padding:10px 0;
font:11px 'Montserrat'
}

.total{
font-size:16px;
border-top:1px solid #15121222;
margin-top:10px;
padding-top:20px
}

.checkout{
display:block;
background:#17352b;
color:white;
text-decoration:none;
text-align:center;
padding:17px;
margin-top:20px;
font:9px 'Montserrat';
letter-spacing:3px
}

.continue{
display:block;
text-align:center;
margin-top:15px;
color:#151212;
font:9px 'Montserrat';
letter-spacing:2px;
text-decoration:none
}

.empty{
text-align:center;
padding:80px;
font:12px 'Montserrat';
opacity:.6
}

.empty a{
display:inline-block;
margin-top:20px;
color:#151212
}

@media(max-width:700px){

header{
padding:22px 6%
}

.logo img{
width:82px
}

.container{
width:88%;
margin:50px auto
}

.title-row{
align-items:flex-start;
flex-direction:column
}

h1{
font-size:45px
}

.item{
grid-template-columns:90px 1fr;
gap:18px
}

.item img{
width:90px;
height:120px
}

.item-price{
grid-column:2
}

.summary{
width:100%
}

}

</style>

</head>

<body>

<header>

<a href="index.html" class="logo">
<img src="lunera-logo.png" alt="LUNÉRA">
</a>

<a href="product.html" class="back">
CONTINUE SHOPPING
</a>

</header>


<main class="container">

<div class="title-row">

<h1>
Your Bag
</h1>

<button class="clear" onclick="clearBag()">
CLEAR BAG
</button>

</div>


<div id="cart"></div>

<div id="summary" class="summary"></div>

</main>


<script>

function getCart(){

try{

return JSON.parse(
localStorage.getItem("luneraCart")
)||[];

}catch{

return [];

}

}


function money(v){

return Number(
String(v).replace(/[₹,]/g,"")
)||0;

}


function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function render(){

const cart=getCart();

const box=document.getElementById("cart");

const summary=document.getElementById("summary");


if(!cart.length){

box.innerHTML=`

<div class="empty">

Your bag is currently empty.

<br>

<a href="product.html">
Discover LUNÉRA
</a>

</div>

`;

summary.innerHTML="";

return;

}


let total=0;


box.innerHTML=

cart.map((item,i)=>{

const price=money(item.price);

const quantity=
Math.max(1,Number(item.quantity)||1);

const amount=
price*quantity;

total+=amount;


return `

<div class="item">

<img
src="${escapeHTML(item.image||"lunera-logo.png")}"
alt="${escapeHTML(item.name)}"
onerror="this.src='lunera-logo.png'"
>

<div>

<div class="name">
${escapeHTML(item.name)}
</div>

<div class="info">
SIZE: ${escapeHTML(item.size||"One Size")}
</div>

<div class="quantity">

<button onclick="change(${i},-1)">
−
</button>

<span>
${quantity}
</span>

<button onclick="change(${i},1)">
+
</button>

</div>

<button
class="remove"
onclick="removeItem(${i})"
>
REMOVE
</button>

</div>

<div class="item-price">
₹${amount.toLocaleString("en-IN")}
</div>

</div>

`;

}).join("");


summary.innerHTML=`

<div class="row">

<span>
SUBTOTAL
</span>

<span>
₹${total.toLocaleString("en-IN")}
</span>

</div>


<div class="row">

<span>
SHIPPING
</span>

<span>
FREE
</span>

</div>


<div class="row total">

<strong>
TOTAL
</strong>

<strong>
₹${total.toLocaleString("en-IN")}
</strong>

</div>


<a
href="checkout.html"
class="checkout"
>
PROCEED TO CHECKOUT
</a>


<a
href="product.html"
class="continue"
>
CONTINUE SHOPPING
</a>

`;

}


function change(i,n){

const cart=getCart();

if(!cart[i])return;


cart[i].quantity=
(Number(cart[i].quantity)||1)+n;


if(cart[i].quantity<1){

cart.splice(i,1);

}


localStorage.setItem(
"luneraCart",
JSON.stringify(cart)
);


render();

}


function removeItem(i){

const cart=getCart();

if(!cart[i])return;


cart.splice(i,1);


localStorage.setItem(
"luneraCart",
JSON.stringify(cart)
);


render();

}


function clearBag(){

const cart=getCart();

if(!cart.length)return;


if(
confirm("Remove all items from your bag?")
){

localStorage.removeItem("luneraCart");

render();

}

}


render();

</script>

</body>
</html>
