<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LUNÉRA — Checkout</title>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f7f4ef;color:#151212;font-family:Arial}
header{background:#151212;padding:27px 8%;display:flex;justify-content:space-between}
.logo{color:white;text-decoration:none;font:500 30px 'Bodoni Moda';letter-spacing:9px}
.back{color:white;text-decoration:none;font:9px 'Montserrat';letter-spacing:2px}
.container{width:84%;max-width:1100px;margin:65px auto}
h1{font:400 60px 'Bodoni Moda';margin-bottom:45px}
.grid{display:grid;grid-template-columns:1fr 400px;gap:70px}
h2{font:400 30px 'Bodoni Moda';margin-bottom:25px}
input,textarea{width:100%;padding:15px;border:1px solid #15121233;background:white;margin-bottom:14px;font-family:Arial}
textarea{height:100px;resize:vertical}
button{width:100%;padding:18px;background:#17352b;color:white;border:0;font:9px 'Montserrat';letter-spacing:3px;cursor:pointer}
.order{border-top:1px solid #151212;padding-top:15px}
.order-row{display:flex;justify-content:space-between;padding:12px 0;font:11px 'Montserrat'}
.total{border-top:1px solid #15121222;margin-top:10px;padding-top:20px;font-size:16px}
@media(max-width:750px){.container{width:88%}h1{font-size:45px}.grid{grid-template-columns:1fr;gap:45px}}
</style>
</head>

<body>

<header>
<a href="index.html" class="logo">LUNÉRA</a>
<a href="cart.html" class="back">BACK TO BAG</a>
</header>

<main class="container">

<h1>Checkout</h1>

<div class="grid">

<div>
<h2>Delivery Details</h2>

<form id="form">

<input id="name" placeholder="Full Name" required>
<input id="phone" placeholder="Phone Number" required>
<input id="email" type="email" placeholder="Email Address">
<input id="address" placeholder="Address" required>
<input id="city" placeholder="City" required>
<input id="state" placeholder="State" required>
<input id="pin" placeholder="PIN Code" required>
<textarea id="notes" placeholder="Additional instructions (optional)"></textarea>

<button type="submit">PLACE ORDER</button>

</form>
</div>

<div>
<h2>Order Summary</h2>
<div id="order" class="order"></div>
</div>

</div>
</main>

<script>
const cart=JSON.parse(localStorage.getItem("luneraCart"))||[];
const order=document.getElementById("order");

function money(v){
return Number(String(v).replace(/[₹,]/g,""))||0;
}

let total=0;

if(!cart.length){
order.innerHTML="<p>Your bag is empty.</p>";
}else{
order.innerHTML=cart.map(item=>{
let amount=money(item.price)*item.quantity;
total+=amount;
return `<div class="order-row"><span>${item.name} × ${item.quantity}</span><span>₹${amount.toLocaleString("en-IN")}</span></div>`;
}).join("")+
`<div class="order-row total"><strong>Total</strong><strong>₹${total.toLocaleString("en-IN")}</strong></div>`;
}

document.getElementById("form").onsubmit=function(e){
e.preventDefault();

if(!cart.length){
alert("Your bag is empty.");
return;
}

const orderId="LUN"+Date.now().toString().slice(-6);

alert(
"Thank you for your order.\n\n"+
"Order ID: "+orderId+"\n"+
"Total: ₹"+total.toLocaleString("en-IN")
);

localStorage.removeItem("luneraCart");
location.href="index.html";
};
</script>

</body>
</html>
