<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>LUNÉRA — Checkout</title>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box
}

body{
background:#f7f4ef;
color:#151212;
font-family:Arial
}

header{
background:#151212;
padding:27px 8%;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
display:flex;
align-items:center;
text-decoration:none
}

.logo img{
width:105px;
height:auto;
display:block
}

.back{
color:white;
text-decoration:none;
font:9px 'Montserrat';
letter-spacing:2px
}

.container{
width:84%;
max-width:1100px;
margin:65px auto
}

h1{
font:400 60px 'Bodoni Moda';
margin-bottom:45px
}

.grid{
display:grid;
grid-template-columns:1fr 400px;
gap:70px
}

h2{
font:400 30px 'Bodoni Moda';
margin-bottom:25px
}

input,
textarea,
select{
width:100%;
padding:15px;
border:1px solid #15121233;
background:white;
margin-bottom:14px;
font-family:Arial
}

textarea{
height:100px;
resize:vertical
}

input:focus,
textarea:focus,
select:focus{
outline:1px solid #17352b
}

button{
width:100%;
padding:18px;
background:#17352b;
color:white;
border:0;
font:9px 'Montserrat';
letter-spacing:3px;
cursor:pointer
}

.order{
border-top:1px solid #151212;
padding-top:15px
}

.order-row{
display:flex;
justify-content:space-between;
gap:20px;
padding:12px 0;
font:11px 'Montserrat'
}

.total{
border-top:1px solid #15121222;
margin-top:10px;
padding-top:20px;
font-size:16px
}

.shipping-note{
font:9px/1.7 'Montserrat';
letter-spacing:1px;
opacity:.55;
margin-top:15px
}

.empty{
text-align:center;
padding:100px 20px;
font:11px 'Montserrat';
letter-spacing:2px;
opacity:.6
}

.empty a{
display:inline-block;
margin-top:20px;
color:#151212
}

.error{
color:#8a1c1c;
font:9px 'Montserrat';
letter-spacing:1px;
margin:-5px 0 15px;
display:none
}

.success{
display:none;
text-align:center;
padding:80px 20px
}

.success h2{
font-size:45px;
margin-bottom:20px
}

.success p{
font:11px/2 'Montserrat';
opacity:.65;
margin-bottom:30px
}

.success a{
display:inline-block;
background:#17352b;
color:white;
text-decoration:none;
padding:16px 25px;
font:9px 'Montserrat';
letter-spacing:2px
}

@media(max-width:750px){

header{
padding:22px 6%
}

.logo img{
width:82px
}

.container{
width:88%
}

h1{
font-size:45px
}

.grid{
grid-template-columns:1fr;
gap:45px
}

}

</style>

</head>

<body>

<header>

<a href="index.html" class="logo">
<img src="lunera-logo.png" alt="LUNÉRA">
</a>

<a href="cart.html" class="back">
BACK TO BAG
</a>

</header>


<main class="container">

<h1>
Checkout
</h1>


<div id="checkoutContent">

<div class="grid">


<div>

<h2>
Delivery Details
</h2>


<form id="form">

<input
id="name"
placeholder="Full Name"
required
autocomplete="name"
>

<input
id="phone"
placeholder="Phone Number"
required
inputmode="numeric"
maxlength="10"
autocomplete="tel"
>

<input
id="email"
type="email"
placeholder="Email Address"
autocomplete="email"
>


<input
id="address"
placeholder="Address"
required
autocomplete="street-address"
>

<input
id="city"
placeholder="City"
required
autocomplete="address-level2"
>

<input
id="state"
placeholder="State"
required
autocomplete="address-level1"
>

<input
id="pin"
placeholder="PIN Code"
required
inputmode="numeric"
maxlength="6"
autocomplete="postal-code"
>


<textarea
id="notes"
placeholder="Additional instructions (optional)"
></textarea>


<div id="error" class="error"></div>


<button type="submit">
PLACE ORDER
</button>

</form>

</div>


<div>

<h2>
Order Summary
</h2>

<div id="order" class="order"></div>

<div class="shipping-note">
Shipping is currently shown as FREE. Actual delivery/payment processing requires a real backend or payment/shipping service.
</div>

</div>


</div>

</div>


<div id="success" class="success">

<h2>
Order Received
</h2>

<p id="successText"></p>

<a href="index.html">
RETURN TO LUNÉRA
</a>

</div>


</main>


<script>

const cart=
JSON.parse(localStorage.getItem("luneraCart"))||[];


const order=
document.getElementById("order");


let total=0;


function money(v){

return Number(
String(v).replace(/[₹,]/g,"")
)||0;

}


function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


if(!cart.length){

document.getElementById("checkoutContent").innerHTML=`

<div class="empty">

Your bag is empty.

<br>

<a href="product.html">
Discover LUNÉRA
</a>

</div>

`;

}else{


order.innerHTML=

cart.map(item=>{

const quantity=
Math.max(1,Number(item.quantity)||1);

const amount=
money(item.price)*quantity;

total+=amount;


return `

<div class="order-row">

<span>
${escapeHTML(item.name)} × ${quantity}
</span>

<span>
₹${amount.toLocaleString("en-IN")}
</span>

</div>

`;

}).join("")+

`

<div class="order-row total">

<strong>
Total
</strong>

<strong>
₹${total.toLocaleString("en-IN")}
</strong>

</div>

`;

}


document.getElementById("form").onsubmit=function(e){

e.preventDefault();


if(!cart.length){

alert("Your bag is empty.");

return;

}


const name=
document.getElementById("name").value.trim();

const phone=
document.getElementById("phone").value.trim();

const email=
document.getElementById("email").value.trim();

const address=
document.getElementById("address").value.trim();

const city=
document.getElementById("city").value.trim();

const state=
document.getElementById("state").value.trim();

const pin=
document.getElementById("pin").value.trim();

const notes=
document.getElementById("notes").value.trim();


const error=
document.getElementById("error");


if(!/^[0-9]{10}$/.test(phone)){

error.textContent=
"Please enter a valid 10-digit phone number.";

error.style.display="block";

return;

}


if(!/^[0-9]{6}$/.test(pin)){

error.textContent=
"Please enter a valid 6-digit PIN code.";

error.style.display="block";

return;

}


error.style.display="none";


const orderId=
"LUN"+Date.now().toString().slice(-8);


const newOrder={

id:orderId,

date:new Date().toISOString(),

customer:{

name:name,

phone:phone,

email:email,

address:address,

city:city,

state:state,

pin:pin,

notes:notes

},

items:JSON.parse(JSON.stringify(cart)),

total:total,

status:"New"

};


const orders=
JSON.parse(localStorage.getItem("luneraOrders"))||[];


orders.push(newOrder);


localStorage.setItem(
"luneraOrders",
JSON.stringify(orders)
);


localStorage.removeItem("luneraCart");


document.getElementById("checkoutContent").style.display="none";

document.getElementById("success").style.display="block";


document.getElementById("successText").textContent=
"Thank you, "+name+". Your order "+orderId+
" has been received. Order total: ₹"+
total.toLocaleString("en-IN")+".";

};

</script>

</body>
</html>
